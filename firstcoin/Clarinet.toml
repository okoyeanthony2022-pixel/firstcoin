[project]
name = 'firstcoin'
description = 'FirstCoin - A SIP-010 compliant fungible token implementation'
authors = ['FirstCoin Team']
telemetry = true
cache_dir = './.cache'
requirements = []
[contracts.firstcoin]
path = 'contracts/firstcoin.clar'
clarity_version = 3
epoch = 'latest'
[repl.analysis]
passes = ['check_checker']

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'
